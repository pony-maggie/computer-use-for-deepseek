[supervisord]
nodaemon=true

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1440x1112x24
autorestart=true

[program:openbox]
command=/usr/bin/openbox
environment=DISPLAY=":1"
autorestart=true

[program:chromium]
command=/usr/bin/chromium --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 --remote-allow-origins=* --window-size=1440,900 about:blank
environment=DISPLAY=":1",HOME="/tmp"
autorestart=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -forever -shared -nopw -rfbport 5900
autorestart=true

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5900
autorestart=true

[program:action-daemon]
command=/usr/bin/python3 /runtime/daemon.py
environment=DISPLAY=":1",WORKSPACE_ROOT="/workspace",WIDTH="1440",HEIGHT="1112"
autorestart=true
