services:
  server:
    image: python:3.12-slim
    working_dir: /app/server
    command: sh -c "pip install -e .[dev] && uvicorn deepseek_computer_use.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./server:/app/server

  web:
    image: node:22-slim
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    volumes:
      - ./web:/app/web

  runtime:
    build:
      context: ./runtime
    image: computer-use-for-deepseek-runtime:local
